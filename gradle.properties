# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
loader_version_range=[1,)

## Mod Properties
# NeoForge mod ids cannot contain hyphens, so "lost-in-the-sky" is "lost_in_the_sky".
mod_id=lost_in_the_sky
mod_name=Lost in the Sky
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.reetro.lostinthesky
mod_authors=Reetro

## Create addon dependency versions
# https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1
create_version=6.0.10-280
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67

## Create Aeronautics (internal mod id "simulated") and Sable
sable_version=2.0.5+mc1.21.1
aeronautics_version=1.3.1+mc1.21.1

## Create Big Cannons (mod id "createbigcannons") and its required library, from CurseForge
# Values are CurseForge file IDs (used by Curse Maven).
# 8303106 = CBC 5.11.7 for NeoForge 1.21.1 (first version with Sable 2.0 support)
# https://www.curseforge.com/minecraft/mc-mods/create-big-cannons/files/8303106
cbc_file_id=8303106
# 7587771 = Ritchie's Projectile Library 2.1.2 for NeoForge 1.21.1
# https://www.curseforge.com/minecraft/mc-mods/ritchies-projectile-library/files/7587771
rpl_file_id=7587771
