modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
A Create Aeronautics addon that raises the world to 2,000 blocks tall and fills the sky
with four layers of floating islands, each with its own biomes, structures and bosses.
Works on top of any overworld generator (vanilla, Tectonic, biome mods).
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    reason="Lost in the Sky is a Create Aeronautics addon."
    versionRange="[6.0.10,6.1.0)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sable"
    type="required"
    reason="Required by Create Aeronautics."
    versionRange="[2.0.0,)"
    ordering="AFTER"
    side="BOTH"

# Create Aeronautics' internal mod id is "simulated".
[[dependencies.${mod_id}]]
    modId="simulated"
    type="required"
    reason="Lost in the Sky is a Create Aeronautics addon: the islands are meant to be reached by airship."
    versionRange="[1.3.0,)"
    ordering="AFTER"
    side="BOTH"
