plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven {
        url = "https://api.modrinth.com/maven" // Sable, Create Aeronautics
        content { includeGroup "maven.modrinth" }
    }
    maven {
        url = "https://cursemaven.com" // CurseForge files: Create Big Cannons, RPL
        content { includeGroup "curse.maven" }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    sableJar { transitive = false }
}

// Sable's math/API types (Pose3d etc.) live in a jar nested inside Sable (sable-companion).
// FML loads it at runtime; for compiling we pull it out of the Sable jar.
var extractSableCompanion = tasks.register("extractSableCompanion", Sync) {
    from({ zipTree(configurations.sableJar.singleFile) }) {
        include 'META-INF/jarjar/sable-companion-*.jar'
        eachFile { path = name }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir("sable-companion")
}

dependencies {
    // Lost in the Sky does not call Create/Aeronautics code yet, but it is an Aeronautics
    // addon, so they are on the classpath for compiling future integration and for runClient.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    implementation("maven.modrinth:sable:${sable_version}") { transitive = false }
    sableJar("maven.modrinth:sable:${sable_version}")
    compileOnly(files(extractSableCompanion).asFileTree)
    implementation("maven.modrinth:create-aeronautics:${aeronautics_version}") { transitive = false }

    // Create Big Cannons, and Ritchie's Projectile Library which it requires (both from CurseForge).
    implementation("curse.maven:create-big-cannons-646668:${cbc_file_id}") { transitive = false }
    implementation("curse.maven:ritchies-projectile-library-1279407:${rpl_file_id}") { transitive = false }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
